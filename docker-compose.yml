version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: nebraska-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nebraska_password
      POSTGRES_DB: nebraska
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nebraska:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebraska-app
    ports:
      - "8000:8000"
    environment:
      NEBRASKA_DB_URL: "postgres://postgres:nebraska_password@postgres:5432/nebraska?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
